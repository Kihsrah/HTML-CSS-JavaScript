<!DOCTYPE html>
<html lang="en">

<head>

  <title>Mondrian Project</title>
  <style>
    /*

    Gap Colour: #000

    For dimensions, see dimensions.png image.

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: #F0F1EC;
      display: grid;
      width: 748px;
      height: 748px;
      margin: 0px;
      grid-template-columns: 329px 207px 162px 50px;
      grid-template-rows: 423px 140px 164px 20px;
    }

    .one {
      background-color: #E72F24;
      border-right: 9px solid #232629;
      border-bottom: 9px solid #232629;
    }

    .two {
      border-bottom: 9px solid #232629;
    }

    .three {
      border-bottom: 9px solid #232629;
    }

    .four {
      border-bottom: 9px solid #232629;
    }

    .five {
      border-right: 9px solid #232629;
    }

    .seven {
      border-right: 9px solid ;
      border-right: 9px solid ;
    }

    .eight {
      border-bottom: 20px solid #232629;
      background-color: #004592;
    }

    .nine {
      border-right: 9px solid #232629;
      border-bottom: 9px solid #232629;
    }

    .ten {
      border-bottom: 9px solid #232629;
    }

    .eleven {
      border-right: 9px solid #232629;
      border-bottom: 9px solid #232629;
    }

    .thirteen {
      border-right: 9px solid #232629;
    }

    .fourteen {
      background-color: #F9D01E;
    }

    .fifteen {
      background-color: #232629;
    }

  </style>
</head>

</body>

</html>
