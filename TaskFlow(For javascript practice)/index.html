
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <h1>TaskFlow</h1>
            <p>Plan your work. Get things done.</p>
        </header>

        <section class="task-form">
            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >
                <button type="submit" id="addTaskBtn">Add Task</button>
            </form>
            <p id="errorMessage" class="error"></p>
        </section>

        <section class="task-controls">
            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <div class="filters">
                <button type="button" class="filter-btn active"
                    data-filter="all">All</button>
                <button type="button" class="filter-btn"
                    data-filter="pending">Pending</button>
                <button type="button" class="filter-btn"
                    data-filter="completed">Completed</button>
            </div>
        </section>

        <section class="task-summary">
            <p>Total: <span id="totalCount">0</span></p>
            <p>Pending: <span id="pendingCount">0</span></p>
            <p>Completed: <span id="completedCount">0</span></p>
        </section>

        <section class="task-section">
            <h2>Your Tasks</h2>
            <ul id="taskList">
                <!-- JavaScript will insert tasks here -->
            </ul>
            <p id="emptyMessage">No tasks to show.</p>
        </section>

        <footer class="footer">
            <button type="button" id="clearCompletedBtn">
                Clear Completed Tasks
            </button>
        </footer>
    </main>
    <script src="Javasript.js" defer></script>
</body>
</html>
