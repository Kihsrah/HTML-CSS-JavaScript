
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyWise | Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <div>
                <h1>PennyWise <span>💸</span></h1>
                <p>Track your spending. Take control.</p>
            </div>
        </header>

        <!-- Summary -->
        <section class="summary">
            <div class="summary-card">
                <p>Total Spent</p>
                <h2 id="totalSpent">₹0.00</h2>
            </div>

            <div class="summary-card">
                <p>Total Transactions</p>
                <h2 id="transactionCount">0</h2>
            </div>
        </section>

        <!-- Add Transaction Form -->
        <section class="panel">
            <h2>Add Transaction</h2>

            <form id="expenseForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Lunch"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input
                            type="number"
                            id="amount"
                            placeholder="120"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>
                                Select category
                            </option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" id="addExpenseBtn">
                    + Add Expense
                </button>
            </form>
        </section>

        <!-- Category Breakdown -->
        <section class="panel">
            <h2>Spending by Category</h2>

            <div id="categoryBreakdown">
                <p class="empty-message">
                    Your category breakdown will appear here.
                </p>
            </div>
        </section>

        <!-- Transactions -->
        <section class="panel">
            <div class="transactions-header">
                <h2>Recent Transactions</h2>

                <select id="filterCategory">
                    <option value="all">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <input
                type="search"
                id="searchExpense"
                placeholder="Search transactions..."
            >

            <ul id="transactionList">
                <li class="empty-message">
                    No transactions yet. Add your first expense!
                </li>
            </ul>
        </section>

        <footer class="footer">
            <p>Made with 💙 and JavaScript</p>
        </footer>
    </main>
    <script src="javascript.js"></script>
</body>
</html>
